<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jQuery 打招呼小程式</title>
  <!-- 載入 jQuery（CDN） -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    :root{
      --ink:#0f172a;
      --muted:#6b7280;
      --bg:#f5f3ff;
      --panel:#ffffff;
      --brand:#4f46e5;
      --accent:#f97316;
      --accent2:#22c55e;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:"Microsoft JhengHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:radial-gradient(circle at top,#e0f2fe,#f5f3ff 45%,#fee2e2);
      color:var(--ink);
      line-height:1.8;
      font-size:16px;
    }
    a{color:var(--brand);text-decoration:none;}
    a:hover{text-decoration:underline;}

    header{
      background:#0f172a;
      color:#e5e7eb;
      box-shadow:0 4px 16px rgba(15,23,42,0.7);
      margin-bottom:18px;
    }
    .topbar{
      max-width:800px;
      margin:0 auto;
      padding:10px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .top-left{
      display:flex;
      flex-direction:column;
    }
    .brand-title{
      font-size:18px;
      font-weight:700;
    }
    .brand-sub{
      font-size:13px;
      color:#9ca3af;
    }
    .btn-home{
      display:inline-block;
      padding:6px 12px;
      border-radius:999px;
      border:1px solid #4b5563;
      color:#e5e7eb;
      font-size:14px;
      text-decoration:none;
      background:#020617;
    }
    .btn-home:hover{
      background:#111827;
    }

    .container{
      max-width:800px;
      margin:0 auto 30px;
      padding:0 16px 24px;
    }

    .card{
      background:var(--panel);
      border-radius:20px;
      border:1px solid #e5e7eb;
      padding:20px 18px 18px;
      box-shadow:0 14px 32px rgba(15,23,42,0.18);
      position:relative;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      right:-40px;
      top:-40px;
      width:120px;
      height:120px;
      border-radius:50%;
      background:radial-gradient(circle at 30% 20%,#fee2e2,#fecaca 50%,#f97316);
      opacity:0.25;
    }
    .card h1{
      margin:0 0 6px;
      font-size:22px;
    }
    .card p{
      margin:4px 0 12px;
      color:var(--muted);
      font-size:14px;
    }

    .form-row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      margin-top:10px;
    }
    label{
      font-size:14px;
      font-weight:600;
    }
    input[type="text"]{
      flex:1;
      min-width:150px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid #cbd5f5;
      font-size:15px;
    }
    input[type="text"]:focus{
      outline:none;
      border-color:var(--brand);
      box-shadow:0 0 0 2px rgba(79,70,229,0.25);
    }
    button{
      padding:8px 16px;
      border-radius:999px;
      border:1px solid var(--brand);
      background:var(--brand);
      color:#fff;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 10px 22px rgba(79,70,229,0.45);
      transition:transform 0.1s ease, box-shadow 0.1s ease;
    }
    button:hover{
      transform:translateY(-1px);
      box-shadow:0 12px 26px rgba(79,70,229,0.55);
    }

    .hint{
      margin-top:6px;
      font-size:13px;
      color:var(--muted);
    }

    .bubble-wrap{
      margin-top:18px;
      display:flex;
      align-items:flex-end;
      gap:10px;
    }
    .avatar{
      width:52px;
      height:52px;
      border-radius:50%;
      background:radial-gradient(circle at 30% 20%,#fefce8,#fee2e2 50%,#fecaca);
      border:2px solid #fecaca;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      box-shadow:0 4px 10px rgba(15,23,42,0.35);
    }
    .bubble{
      max-width:100%;
      background:#f9fafb;
      border-radius:18px;
      padding:10px 14px;
      border:1px solid #e5e7eb;
      font-size:18px;
      color:#1f2937;
      position:relative;
      min-height:42px;
      display:flex;
      align-items:center;
    }
    .bubble::before{
      content:"";
      position:absolute;
      left:-8px;
      bottom:8px;
      border-width:8px;
      border-style:solid;
      border-color:transparent #f9fafb transparent transparent;
    }
    .bubble.empty{
      color:#9ca3af;
      font-size:15px;
    }

    .bubble span.name{
      color:#4f46e5;
      font-weight:700;
    }

    .back-home{
      margin-top:18px;
      text-align:center;
      font-size:14px;
    }
    .back-home a{
      font-weight:600;
    }

    @media (max-width:600px){
      .card{
        padding:18px 14px 16px;
      }
      .card h1{
        font-size:20px;
      }
    }
  </style>
  <script>
    $(function(){
      $("#btnHello").on("click", function(){
        var name = $("#txtName").val().trim();
        if(name === ""){
          alert("請先輸入你的名字喔！");
          $("#txtName").focus();
          return;
        }
        var msg = "Hello!! <span class=\"name\">" + name + "</span> 你好～ 歡迎來到我的教學網站！";
        $("#bubbleText").html(msg);
        $("#bubbleText").removeClass("empty");
      });

      $("#txtName").on("keypress", function(e){
        if(e.which === 13){
          $("#btnHello").click();
        }
      });
    });
  </script>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="top-left">
        <div class="brand-title">梅子的網際網路學習歷程</div>
        <div class="brand-sub">jQuery 版本的打招呼小程式</div>
      </div>
      <a class="btn-home" href="index.html">← 回首頁</a>
    </div>
  </header>

  <div class="container">
    <section class="card">
      <h1>使用 jQuery 做一個「Hello!! 你好」小程式</h1>
       <div class="form-row">
        <label for="txtName">請輸入你的名字：</label>
        <input type="text" id="txtName" placeholder="例如：小明、小美、同學">
        <button id="btnHello" type="button">打招呼 👋</button>
      </div>
      
      <div class="bubble-wrap">
        <div class="avatar">😊</div>
        <div id="bubbleText" class="bubble empty">這裡會出現「Hello!! 你好」的問候語～</div>
      </div>
    </section>

    <div class="back-home">
      <a href="index.html">⬅ 回首頁（回到教學網站首頁）</a>
    </div>
  </div>
</body>
</html>
